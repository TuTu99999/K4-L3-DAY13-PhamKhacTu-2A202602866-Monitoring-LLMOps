service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: Baseline local có latency P95 dưới 3000 ms và không có request lỗi; ngưỡng 3000 ms là guardrail trải nghiệm người dùng. Challenge rag_slow đạt P95 2659 ms nên chưa vi phạm SLO này và được phát hiện bằng mức tăng tương đối so với baseline.
  error_budget_example:
    total_requests: 10000
    max_bad_requests: 50
    calculation: 10000 * 0.5% = 50 request được phép lỗi hoặc chậm hơn 3000 ms trong 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
